# Executable SR1–SR5 verification (hardening roadmap Step 4).
# Every job runs on every push/PR so security-requirement regressions fail CI
# instead of waiting for an external review.
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
